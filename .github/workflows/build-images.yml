name: Build and Push Changed Images

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/**

permissions:
  id-token: write
  contents: read
  security-events: write

concurrency:
  group: build-images-main
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 481609031842.dkr.ecr.ap-south-1.amazonaws.com
  BACKEND_REPOSITORY: sujyoti-edtech-backend-prod
  FRONTEND_REPOSITORY: sujyoti-edtech-frontend-prod
  IAM_ROLE: arn:aws:iam::481609031842:role/Terraform-deployer-role

jobs:
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend and frontend changes
        id: filter
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            changed_files=$(git ls-files)
          else
            changed_files=$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
          fi

          backend=false
          frontend=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              .github/workflows/*)
                backend=true
                frontend=true
                ;;
              backend/*)
                backend=true
                ;;
              frontend/*)
                frontend=true
                ;;
            esac
          done <<< "$changed_files"

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          printf '%s\n' "$changed_files"
          echo "Backend build: $backend"
          echo "Frontend build: $frontend"

  backend:
    name: Build and Push Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE }}
          role-session-name: github-actions-backend-build-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend test stage
        run: |
          docker buildx build \
            --target test \
            --tag "speakedge-backend:test-${GITHUB_SHA}" \
            --load \
            ./backend

      - name: Build backend runtime image
        env:
          IMAGE_SHA: ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPOSITORY }}:sha-${{ github.sha }}
          IMAGE_LATEST: ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPOSITORY }}:latest
        run: |
          docker buildx build \
            --target runtime \
            --tag "$IMAGE_SHA" \
            --tag "$IMAGE_LATEST" \
            --provenance=false \
            --load \
            ./backend

      - name: Push backend images
        env:
          IMAGE_SHA: ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPOSITORY }}:sha-${{ github.sha }}
          IMAGE_LATEST: ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPOSITORY }}:latest
        run: |
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"
          echo "### Backend image published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Immutable tag: sha-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rolling tag: latest" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Build and Push Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE }}
          role-session-name: github-actions-frontend-build-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend runtime image
        env:
          IMAGE_SHA: ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPOSITORY }}:sha-${{ github.sha }}
          IMAGE_LATEST: ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPOSITORY }}:latest
        run: |
          docker buildx build \
            --target runtime \
            --tag "$IMAGE_SHA" \
            --tag "$IMAGE_LATEST" \
            --provenance=false \
            --load \
            ./frontend

      - name: Push frontend images
        env:
          IMAGE_SHA: ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPOSITORY }}:sha-${{ github.sha }}
          IMAGE_LATEST: ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPOSITORY }}:latest
        run: |
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"
          echo "### Frontend image published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Immutable tag: sha-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rolling tag: latest" >> "$GITHUB_STEP_SUMMARY"
